name: Moon over Monterrey

on:
  workflow_dispatch:
  schedule:
    # 19:17 UTC is 1:17 PM in Monterrey (America/Monterrey, UTC-6).
    # Off the hour to reduce scheduled-run delays.
    - cron: '17 19 * * *'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Write today's moon report
        run: python moon_bot.py
